---
name: Rebuild RHEL 9 CIS containerDisk

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  build:
    name: Build and push containerDisk
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ansible-core
        run: pip install ansible-core

      - name: Configure Red Hat token
        run: |
          printf '[galaxy_server.rh_certified]\ntoken=%s\n' "$RH_OFFLINE_TOKEN" > ~/.ansible.cfg
        env:
          RH_OFFLINE_TOKEN: ${{ secrets.RH_OFFLINE_TOKEN }}

      - name: Log in to Quay.io
        run: podman login -u "$QUAY_USERNAME" -p "$QUAY_PASSWORD" quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push containerDisk
        run: |
          ansible-playbook playbooks/build_cis_containerdisk.yml \
            -i inventories/sample/
