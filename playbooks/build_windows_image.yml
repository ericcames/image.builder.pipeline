---
# ===========================================================================
# build_windows_image.yml — build a CIS L1 hardened Windows Server 2022
# image on OpenShift Virtualization. Issue #24.
#
#   export K8S_AUTH_HOST=https://api.<cluster>:6443
#   export K8S_AUTH_API_KEY=<token>
#   export WINDOWS_ADMIN_PASSWORD=<password>
#   ansible-playbook -i inventories/sample/ playbooks/build_windows_image.yml \
#     -e windows_eval_expires=2027-03-04 \
#     -e demo_cluster_hostname=cluster-xxxxx
#
#   # unhardened build (PR 1 behavior)
#   ansible-playbook -i inventories/sample/ playbooks/build_windows_image.yml \
#     -e windows_cis_harden=false -e windows_sysprep_at_first_logon=true \
#     -e windows_eval_expires=2027-03-04 -e demo_cluster_hostname=cluster-xxxxx
#
#   # and the teardown, which ships with it
#   ansible-playbook -i inventories/sample/ playbooks/build_windows_image.yml \
#     -e windows_build_state=absent
#
# THREE PLAYS, ONE PIPELINE.
#   Play 1 — infrastructure: namespace, ISO import, VM, wait for install.
#   Play 2 — hardening: WinRM into the build VM, apply CIS L1, sysprep.
#            Only runs when windows_cis_harden is true. The role needs
#            Windows facts, so this is a separate play targeting the VM.
#   Play 3 — completion: wait for the VM to stop, clean up the port-forward,
#            report what was built.
#
# WHY THE CLUSTER AND NOT A LOCAL HYPERVISOR. #21 flags "a local libvirt/KVM
# scan path — new hypervisor dependency" as its High-risk item. A KubeVirt
# cluster IS a hypervisor, so building here avoids that dependency rather than
# incurring it. It also means the image is exercised by KubeVirt before any
# consumer sees it, which a laptop-built qcow2 never is.
#
# NO OPERATOR IS INSTALLED. This drives plain VirtualMachine objects with
# kubernetes.core, the same way this repo already drives EC2 with amazon.aws.
# Red Hat's windows-efi-installer Tekton pipeline would do the same job, but it
# would mean installing OpenShift Pipelines into a cluster the CONSUMER repo
# owns, for this repo's benefit — the one genuine cross-repo dependency, and it
# buys nothing the API does not already give us.
#
# CREDENTIALS ARE ENV VARS, per docs/design.md §4. This playbook loads no
# vault and imports nothing from sales.demos' secrets mechanism, so it stays
# runnable by someone who has never seen that repo.
#
# THAT IS THE PLAYBOOK'S CONTRACT, NOT AN ANSWER TO "WHERE DO I GET THEM".
# All three values are maintained in sales.demos and nowhere else, and working
# that out from scratch has cost a search of another repo's vault twice now.
# docs/design.md §4.1 names the three files. Export them into the shell that
# runs this; do not write them to a file here.
#
# BUILD ON SANDBOX, NEVER ON DEMO. A 45-minute Windows install has no business
# on a cluster anyone might present from. The artifact is published to quay, so
# the demo environment consumes a tag and never hosts a build.
#
# THE BUILD NEEDS NO ONE AT THE CONSOLE (#40, #44). The stock ISO's UEFI boot
# image asks "Press any key to boot from CD or DVD" and fails silently when
# nobody answers, so a pod on the cluster patches the El Torito boot image to
# Microsoft's own efisys_noprompt.bin before CDI imports it. The two are the
# same size on this medium, so it is a byte-exact overwrite at one LBA — the
# UDF filesystem is left exactly as Microsoft shipped it. Pass
# -e windows_iso_remaster=false to go back to the stock ISO and a keypress.
#
# CIS HARDENING (#24 PR 2). ansible-lockdown/Windows-2022-CIS applied as
# L1 Member Server. KubeVirt reports ansible_virtualization_type "NA", which
# the role's auto-detect treats as cloud — hosted_virtual_system_override
# forces non-cloud lockout order and avoids a secedit failure on rule 1.2.1.
# win_skip_for_test skips 11 controls that would kill WinRM mid-run.
# Verified 2026-09-06: 44 controls applied, idempotent on re-run.
#
# THE PORT-FORWARD CAN DIE. kubectl port-forward uses a WebSocket, and
# connections exceeding ~15 minutes have dropped during testing. The CIS role
# takes ~15 minutes. If it dies, the task fails with a WinRM connection
# error — re-run the playbook; the role is idempotent and the completed
# controls are preserved.
#
# WHAT publish_windows_containerdisk.yml DOES is next: VirtualMachineExport,
# containerdisk wrap, podman push to private quay. It expects a Stopped VM.
# ===========================================================================

- name: Build a Windows Server 2022 image on OpenShift Virtualization
  hosts: localhost
  connection: local
  gather_facts: false

  environment:
    # kubernetes.core reads these; keeps the token out of every task's args and
    # out of any -vvv output.
    K8S_AUTH_HOST: "{{ k8s_auth_host }}"
    K8S_AUTH_API_KEY: "{{ k8s_auth_api_key }}"
    K8S_AUTH_VERIFY_SSL: "{{ k8s_verify_ssl | string }}"

  vars:
    # --- Connection, resolved the way every credential in this repo is -------
    k8s_auth_host: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_HOST') }}"
    k8s_auth_api_key: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY') }}"
    k8s_verify_ssl: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_VERIFY_SSL') | default(false, true) | bool }}"

    windows_build_state: "present"
    build_namespace: "image-factory-windows"
    # Where OpenShift Virtualization lives, for the virtio-win ConfigMap lookup.
    cnv_namespace: "openshift-cnv"

    # --- Inputs --------------------------------------------------------------
    # HOW THE ISO REACHES THE CLUSTER. Default 'url': CDI's importer pulls it
    # straight from Microsoft, and the machine running this playbook never
    # touches the bytes.
    #
    # MEASURED 2026-09-04, and the gap is not subtle:
    #   laptop -> cluster via virtctl upload   ~1 MiB/s     ~75 min
    #   cluster -> Microsoft via CDI importer  ~246 MiB/s   under 25 s
    # The first design had this machine download 4.7 GB and push the same 4.7 GB
    # back up a domestic uplink. Use 'upload' only for a cluster with no egress.
    windows_iso_source: "url"

    # Microsoft's own fwlink, which redirects to
    # software-static.download.prss.microsoft.com. Verified to serve
    # 5,044,094,976 bytes, http 200, from inside the cluster.
    windows_iso_url: "https://go.microsoft.com/fwlink/p/?LinkID=2195280"

    # Only used when windows_iso_source is 'upload'.
    windows_iso_path: ""
    # Verified 2026-09-04 against the ISO served by
    # https://go.microsoft.com/fwlink/p/?LinkID=2195280 (5,044,094,976 bytes).
    # Pinned rather than blank, on the same reasoning execution-environment.yml
    # pins terraform: a factory that does not know what it consumed cannot say
    # what it produced. Pass -e windows_iso_sha256='' to skip, or the new value
    # if Microsoft refreshes the media.
    windows_iso_sha256: "3e4fa6d8507b554856fc9ca6079cc402df11a8b79344871669f0251535255325"
    windows_iso_size: "8Gi"

    # --- Removing the last manual step (#40) ---------------------------------
    # THE STOCK ISO WILL NOT BOOT UNATTENDED. Microsoft's UEFI boot image asks
    # "Press any key to boot from CD or DVD" with a ~5 second timeout, and when
    # nobody answers it the console simply sits there — so a build that needs a
    # human looks exactly like a build that is merely slow. It cost a wasted
    # 25-minute run before anyone noticed.
    #
    # Microsoft ships efisys_noprompt.bin beside efisys.bin for exactly this,
    # and Red Hat's windows-efi-installer pipeline swaps it in too, so this is
    # the sanctioned fix rather than a trick. A pod on the cluster does the swap
    # and serves the result to CDI: the 4.7 GB never crosses the slow link
    # (#36), and the proven source.http import path is unchanged — only the URL
    # differs.
    #
    # THE FIRST ATTEMPT USED xorriso AND FAILED ON REAL MEDIA (#44). The Windows
    # medium is UDF — it has to be, since sources/install.wim is 4,340,202,461
    # bytes and ISO 9660 cannot hold a single extent past 4 GiB — and libisofs
    # has no UDF reader, so it saw a one-file stub. See remaster_iso.sh.
    windows_iso_remaster: true
    remaster_name: "{{ build_vm_name }}-remaster"
    remaster_url: >-
      http://{{ remaster_name }}.{{ build_namespace }}.svc:{{ iso_remaster_port
      }}/{{ iso_remaster_filename }}

    # TWO IMAGES, BOTH RED HAT'S OWN, both pinned by digest on the same
    # reasoning execution-environment.yml pins its base: a tag is a moving
    # target, and a factory that cannot say what it consumed cannot say what it
    # produced. Verified 2026-09-05 against what this cluster resolves the
    # v0.26.0 tags to.
    #
    # THE PATCH NEEDS guestfish AND THE KVM DEVICE (#44). The medium is UDF, and
    # only libguestfs can read it — it boots a kernel that has a UDF driver,
    # which is exactly why Red Hat's modify-windows-iso-file asks for
    # devices.kubevirt.io/kvm. That image has no python3, so serving is a
    # separate container on the image that does.
    iso_remaster_image: >-
      quay.io/kubevirt/tekton-tasks-disk-virt@sha256:694dc93a7712165fdadad64e02631f079084a5264f94303d9ebe4d7df189bd0f
    iso_serve_image: >-
      quay.io/kubevirt/tekton-tasks@sha256:87743fb600a52ee23ef8f673d286610fc0396e94790f2a9a38887329f1ff7445

    # A PVC, NOT AN emptyDir. An emptyDir spends the node's ephemeral storage,
    # and crossing that line evicts the pod under disk pressure, which reads as
    # an unexplained restart rather than as "out of space". Peak use is the ISO
    # plus 3 MB of boot images — the patch never makes a second copy, and the
    # finished medium is renamed into place on the same filesystem. Deleted as
    # soon as the import succeeds.
    iso_remaster_scratch_size: "8Gi"
    iso_remaster_port: 8080
    iso_remaster_filename: "windows-2022-noprompt.iso"

    # THE 180-DAY CLOCK. Evaluation media expires, and an expired Windows guest
    # nags and then shuts down hourly — mid-demo, if nobody wrote the date down.
    # This is stamped into the image label and must reach the run-sheet too.
    windows_eval_expires: ""

    # --- The build VM --------------------------------------------------------
    # Red Hat's shipped instance type, deliberately NOT sales.demos' sd1.*
    # types: those are created and destroyed by that repo's terraform, so a
    # build depending on them would break whenever it ran a teardown.
    # Measured on sandbox: u1.large is 2 vCPU / 8 GiB.
    build_instancetype: "u1.large"
    build_preference: "windows.2k22"
    build_vm_name: "win2k22-build"
    target_disk_size: "60Gi"
    windows_disk_bus: "virtio"

    # DO NOT HARDCODE THIS. Three traps in one string, and the cluster will tell
    # you about all of them if you ask (#35):
    #   - the repo is virtio-win-rhel9, not virtio-win
    #   - it REFUSES the :latest tag, so an untagged reference fails to pull
    #   - CNV pins it by digest, and the digest moves with the CNV version
    # HCO maintains a ConfigMap naming exactly the image it uses, so reading that
    # is correct on any cluster at any CNV version. Set this only to override,
    # e.g. for an air-gapped mirror.
    virtio_win_image: ""
    virtio_drive_letter: "E"

    # --- Guest settings, rendered into autounattend.xml ----------------------
    # MUST match a WIM image name in the ISO exactly, or Setup stops on the
    # edition-selection screen — which reads as a hang, because there is no
    # console output to explain it. Verified 2026-09-04 with
    # playbooks/scripts/wim_images.py against the ISO above; it holds 4 images:
    #   1 SERVERSTANDARDCORE    Standard Evaluation
    #   2 SERVERSTANDARD        Standard Evaluation (Desktop Experience)  <-- this
    #   3 SERVERDATACENTERCORE  Datacenter Evaluation
    #   4 SERVERDATACENTER      Datacenter Evaluation (Desktop Experience)
    windows_image_name: "Windows Server 2022 SERVERSTANDARD"
    windows_computer_name: "WIN2K22GOLD"
    windows_ui_language: "en-US"
    windows_input_locale: "en-US"
    windows_timezone: "UTC"
    windows_owner_name: "Image Builder Pipeline"
    windows_owner_org: "Red Hat Demo"
    windows_autologon_count: 1
    winrm_port: 5986
    build_marker_file: "build-complete.txt"

    # CIS hardening. When true (the default), the playbook applies
    # ansible-lockdown/Windows-2022-CIS L1 Member Server after install,
    # then syspreps via WinRM. When false, behaves as PR 1 (sysprep from
    # the answer file, no hardening, no WinRM round trip).
    windows_cis_harden: true
    windows_sysprep_at_first_logon: false

    # Port-forward from this machine to the build VM's WinRM. 15986 rather
    # than 5986 to avoid colliding with a local WinRM listener.
    winrm_forward_port: 15986

    # The local Administrator password baked into the image. Never committed:
    # supply with -e, or export WINDOWS_ADMIN_PASSWORD.
    windows_admin_password: "{{ lookup('ansible.builtin.env', 'WINDOWS_ADMIN_PASSWORD') }}"

    # AN HOUR IS THE WRONG DEFAULT FOR A THROWAWAY (#54). KubeVirt's Windows
    # preference asks for terminationGracePeriodSeconds 3600, which is right for
    # a machine someone cares about and wrong for this one: a guest wedged mid
    # Setup never shuts down cleanly, so every teardown waits out the full hour
    # with the namespace stuck Terminating behind it. Measured — a launcher pod
    # deleted at 16:41 carried deletionTimestamp 17:41.
    #
    # This VM exists to be rebuilt and holds nothing anyone would grieve. Sixty
    # seconds still lets a healthy guest flush and halt.
    build_termination_grace_seconds: 60

    build_wait_retries: 120
    build_wait_delay: 30

  tasks:
    - name: Assert the requested state is valid
      ansible.builtin.assert:
        that:
          - windows_build_state in ['present', 'absent']
        fail_msg: >-
          windows_build_state must be 'present' or 'absent', not
          '{{ windows_build_state }}'.

    - name: Assert the cluster connection is available
      ansible.builtin.assert:
        that:
          - k8s_auth_host | length > 0
          - k8s_auth_api_key | length > 0
        fail_msg: >-
          K8S_AUTH_HOST and K8S_AUTH_API_KEY must be exported. See
          docs/design.md §4 — this repo resolves every credential from the
          environment and stores none of them.

    - name: Assert demo_cluster_hostname is provided
      ansible.builtin.assert:
        that:
          - demo_cluster_hostname is defined
          - demo_cluster_hostname | length > 0
        fail_msg: >-
          demo_cluster_hostname must be set (e.g. -e demo_cluster_hostname=cluster-xxxxx).
          It identifies the demo cluster so the build refuses to run there.
          See sales.demos inventory/group_vars/<env>/connection.yml for the value.
      when: windows_build_state == 'present'

    - name: Assert this is not the demo cluster
      ansible.builtin.assert:
        that:
          - not (k8s_auth_host is search(demo_cluster_hostname))
        fail_msg: >-
          K8S_AUTH_HOST looks like the demo cluster ({{ k8s_auth_host }}).
          Builds run on sandbox; demo consumes the published tag and never
          hosts a build. Override with -e demo_cluster_hostname='' if you are
          certain.
      when: windows_build_state == 'present'

    - name: Assert CIS hardening and sysprep are consistent
      ansible.builtin.assert:
        that:
          - not (windows_cis_harden | bool) or not (windows_sysprep_at_first_logon | bool)
        fail_msg: >-
          windows_cis_harden requires windows_sysprep_at_first_logon=false.
          Generalizing before hardening throws the hardening away — the CIS
          role needs a running OS to harden, and sysprep resets it to OOBE.
      when: windows_build_state == 'present'

    - name: Assert kubectl is available for CIS port-forward
      ansible.builtin.command: kubectl version --client --output=yaml
      register: kubectl_check
      changed_when: false
      failed_when: kubectl_check.rc != 0
      when:
        - windows_build_state == 'present'
        - windows_cis_harden | bool

    - name: Assert the CIS role is installed
      ansible.builtin.stat:
        path: "{{ lookup('config', 'DEFAULT_ROLES_PATH') | first }}/windows_2022_cis/meta/main.yml"
      register: cis_role_stat
      when:
        - windows_build_state == 'present'
        - windows_cis_harden | bool

    - name: Fail if the CIS role is not installed
      ansible.builtin.assert:
        that:
          - cis_role_stat.stat.exists | default(false)
        fail_msg: >-
          The windows_2022_cis role is not installed. Install it with:
          ansible-galaxy role install -r roles/requirements.yml
      when:
        - windows_build_state == 'present'
        - windows_cis_harden | bool

    - name: Assert the ISO source is valid
      ansible.builtin.assert:
        that:
          - windows_iso_source in ['url', 'upload']
        fail_msg: >-
          windows_iso_source must be 'url' (the cluster fetches it, ~25s) or
          'upload' (this machine streams it, ~75 min on a domestic uplink).

    - name: Assert the re-master and the ISO source agree
      # The re-master happens in a pod that fetches from windows_iso_url, so it
      # cannot touch a file that exists only on this machine. Saying so out
      # loud beats ignoring windows_iso_remaster quietly and leaving someone
      # waiting at a console for a prompt they were told had been removed.
      ansible.builtin.assert:
        that:
          - not (windows_iso_remaster | bool) or windows_iso_source == 'url'
        fail_msg: >-
          windows_iso_remaster needs windows_iso_source=url. On the 'upload'
          path the media reaches the cluster only as an already-imported disk,
          so pass -e windows_iso_remaster=false and expect to press a key at
          the console when Setup asks (#40).
      when: windows_build_state == 'present'

    - name: Assert the build inputs are present
      ansible.builtin.assert:
        that:
          - windows_iso_source == 'url' or windows_iso_path | length > 0
          - windows_admin_password | length > 0
          - windows_eval_expires | length > 0
        fail_msg: >-
          Need windows_iso_path (the evaluation ISO), windows_admin_password
          (or WINDOWS_ADMIN_PASSWORD in the environment), and
          windows_eval_expires (the 180-day expiry date, YYYY-MM-DD) — an
          undated evaluation image is a time bomb nobody can see.
      when: windows_build_state == 'present'

    - name: Check the ISO is readable
      ansible.builtin.stat:
        path: "{{ windows_iso_path }}"
        checksum_algorithm: sha256
        get_checksum: "{{ windows_iso_sha256 | length > 0 }}"
      register: iso_stat
      when:
        - windows_build_state == 'present'
        - windows_iso_source == 'upload'

    - name: Assert the ISO exists and matches its checksum when one is given
      ansible.builtin.assert:
        that:
          - iso_stat.stat.exists
          - windows_iso_sha256 | length == 0 or iso_stat.stat.checksum == windows_iso_sha256
        fail_msg: >-
          {{ windows_iso_path }} is missing or does not match
          windows_iso_sha256. Pinning the checksum is the same discipline
          build_cis_image.yml applies to everything else it pulls.
      when:
        - windows_build_state == 'present'
        - windows_iso_source == 'upload'

    - name: Check virtctl is available
      # The one local tool this needs. `virtctl image-upload` streams the ISO
      # through the cdi-uploadproxy Route, which is the supported path for
      # getting media onto a cluster.
      ansible.builtin.command: virtctl version --client
      register: virtctl_check
      changed_when: false
      failed_when: virtctl_check.rc != 0
      when:
        - windows_build_state == 'present'
        - windows_iso_source == 'upload'

    # --- Teardown ------------------------------------------------------------
    - name: Remove the build namespace
      # Everything this playbook creates lives in one namespace, so teardown is
      # one delete. wait: false because a namespace with PVCs can take many
      # minutes to finalize and nothing here needs to watch it go.
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Namespace
        name: "{{ build_namespace }}"
        wait: false
      when: windows_build_state == 'absent'

    - name: Report the teardown
      ansible.builtin.debug:
        msg: >-
          Deleted namespace {{ build_namespace }}. The published containerdisk,
          if PR 3 has run, is unaffected — that is the point of publishing it.
      when: windows_build_state == 'absent'

    - name: End the play after teardown
      ansible.builtin.meta: end_play
      when: windows_build_state == 'absent'

    # --- Build ---------------------------------------------------------------
    - name: Look up the virtio-win image this cluster's CNV uses
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: virtio-win
        namespace: "{{ cnv_namespace }}"
      register: virtio_cm
      when: virtio_win_image | length == 0

    - name: Resolve the virtio-win image reference
      ansible.builtin.set_fact:
        virtio_win_image_resolved: >-
          {{ virtio_win_image if virtio_win_image | length > 0
             else (virtio_cm.resources | default([]) | first | default({})).data['virtio-win-image'] | default('') }}

    - name: Assert the virtio-win image resolved
      ansible.builtin.assert:
        that:
          - virtio_win_image_resolved | length > 0
        fail_msg: >-
          Could not resolve the virtio-win image. Expected a ConfigMap named
          'virtio-win' in {{ cnv_namespace }} carrying a 'virtio-win-image'
          key, which HCO creates. Pass -e virtio_win_image=<ref> to override.
        quiet: true

    - name: Look for a build namespace that is still going away
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ build_namespace }}"
      register: build_ns

    - name: Refuse to build into a namespace that is still terminating
      # THIS FAILS QUIETLY WITHOUT THE GUARD, and that is the whole point (#54).
      # Kubernetes refuses to CREATE objects in a terminating namespace — but
      # every object this playbook needs already exists there from the previous
      # build, so `state: present` is a no-op patch and nothing errors. The run
      # then waits for the PREVIOUS VM to power off, having reported that it
      # created a new one. It looks completely normal.
      ansible.builtin.assert:
        that:
          - (build_ns.resources | default([]) | first | default({})).status.phase | default('') != 'Terminating'
        fail_msg: >-
          Namespace {{ build_namespace }} is still Terminating, so this build
          would silently reuse the previous VM. Teardown returns before the
          namespace is gone, by design. Wait for it, or if a wedged guest is
          holding it — a launcher pod can sit out a full grace period — clear it
          with: virtctl stop {{ build_vm_name }} -n {{ build_namespace }}
          --force --grace-period=0. Do NOT force-delete the virt-launcher pod;
          that wedges virt-handler and it then refuses to start any new domain
          with nothing surfaced anywhere.
      when: windows_build_state == 'present'

    - name: Create the build namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ build_namespace }}"
            labels:
              app.kubernetes.io/managed-by: image-builder-pipeline

    - name: Render the answer file into a ConfigMap
      # KubeVirt presents a configMap volume to the guest as an iso9660 CD, and
      # Windows Setup looks for autounattend.xml at the root of removable
      # media. That is why there is no ISO-authoring tool in this playbook:
      # the cluster builds the answer disk.
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ build_vm_name }}-autounattend"
            namespace: "{{ build_namespace }}"
          data:
            autounattend.xml: "{{ lookup('ansible.builtin.template', 'templates/autounattend.xml.j2') }}"
      no_log: true

    - name: Look for an already-uploaded ISO
      kubernetes.core.k8s_info:
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataVolume
        name: "{{ build_vm_name }}-iso"
        namespace: "{{ build_namespace }}"
      register: iso_dv

    - name: Read what the existing ISO import actually holds
      # TWO WAYS THIS GOES WRONG, and both of them look like success.
      #
      # EXISTENCE IS NOT SUCCESS. A failed `virtctl image-upload` leaves the
      # DataVolume behind in PendingPopulation, so a re-run that only asked
      # "does it exist?" would skip the upload and install from an empty disk.
      #
      # NOR IS SUCCESS THE SAME AS THE RIGHT MEDIA (#40). A DataVolume imported
      # before the re-master existed holds the *prompting* ISO: Succeeded, right
      # size, and a build that uses it stops dead at the console. Phase alone
      # cannot tell those apart, so the variant is written onto the DataVolume
      # as an annotation and a mismatch re-imports. A DataVolume carrying no
      # annotation at all — anything imported before this existed — counts as a
      # mismatch and is re-imported. That costs about two minutes once, and it
      # is the right way round to be wrong.
      ansible.builtin.set_fact:
        iso_phase: "{{ (iso_dv.resources | default([]) | first | default({})).status.phase | default('') }}"
        iso_variant_have: >-
          {{ (iso_dv.resources | default([]) | first
              | default({})).metadata.annotations['image-factory/iso-variant']
             | default('') }}
        iso_variant_want: "{{ 'noprompt' if windows_iso_remaster | bool else 'stock' }}"

    - name: Settle whether the imported ISO can be reused
      ansible.builtin.set_fact:
        iso_reusable: "{{ iso_phase == 'Succeeded' and iso_variant_have == iso_variant_want }}"

    - name: Settle whether the re-master has to run
      ansible.builtin.set_fact:
        remaster_needed: "{{ windows_iso_remaster | bool and not iso_reusable | bool }}"

    - name: Report which media the build will use
      ansible.builtin.debug:
        msg: >-
          ISO: {{ 'reusing the imported ' ~ iso_variant_have ~ ' media'
                  if iso_reusable | bool
                  else 'importing ' ~ iso_variant_want ~ ' media' }}{{
            ' (re-mastering it on the cluster first)' if remaster_needed | bool else '' }}

    - name: Remove an ISO DataVolume that cannot be reused
      kubernetes.core.k8s:
        state: absent
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataVolume
        name: "{{ build_vm_name }}-iso"
        namespace: "{{ build_namespace }}"
        wait: true
      when:
        - iso_dv.resources | default([]) | length > 0
        - not iso_reusable | bool

    - name: Re-master the ISO so no one has to press a key
      # RUNS ON THE CLUSTER, NEVER HERE. Measured (#36): the cluster pulls this
      # ISO at ~246 MiB/s and a laptop pushes at ~1 MiB/s, so re-mastering
      # locally would mean a 4.7 GB upload and would undo the whole reason
      # windows_iso_source defaults to 'url'.
      #
      # The pod fetches the stock ISO, verifies windows_iso_sha256, reads the
      # two boot images out of the medium with guestfish, proves the bytes at
      # the El Torito load address are the prompting one, overwrites them with
      # the no-prompt twin of identical length, and serves the result over
      # HTTP. CDI then imports from the Service instead of from Microsoft — one
      # URL different, everything downstream identical and already verified.
      when: remaster_needed | bool
      block:
        - name: Create the scratch volume for the re-master
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: "{{ remaster_name }}"
                namespace: "{{ build_namespace }}"
                labels:
                  app.kubernetes.io/managed-by: image-builder-pipeline
              spec:
                accessModes:
                  - ReadWriteOnce
                # Explicit, because a storage class is free to default this to
                # Block and the pod needs a filesystem to write files into.
                volumeMode: Filesystem
                resources:
                  requests:
                    storage: "{{ iso_remaster_scratch_size }}"

        - name: Publish the re-master script as a ConfigMap
          # The script is a file in this repo rather than a heredoc inside a
          # pod spec inside a playbook, so it can be read, diffed and run
          # locally against a test ISO. It takes its inputs from the
          # environment, which is why it needs no templating.
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: "{{ remaster_name }}"
                namespace: "{{ build_namespace }}"
              data:
                fetch_iso.sh: "{{ lookup('ansible.builtin.file', 'scripts/fetch_iso.sh') }}"
                remaster_iso.sh: "{{ lookup('ansible.builtin.file', 'scripts/remaster_iso.sh') }}"

        - name: Start the re-master pod
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Pod
              metadata:
                name: "{{ remaster_name }}"
                namespace: "{{ build_namespace }}"
                labels:
                  app: "{{ remaster_name }}"
                  app.kubernetes.io/managed-by: image-builder-pipeline
              spec:
                # Never, not OnFailure: a restart would silently re-download
                # 4.7 GB and hide whatever went wrong the first time. A failed
                # pod is left for its log to be read.
                restartPolicy: Never
                # THREE STAGES, AND EACH IMAGE DOES ONLY WHAT IT CAN (#44, #46).
                # Fetching needs a CA bundle, which the guestfish image does not
                # ship — every HTTPS download from it fails with curl error 77.
                # Patching needs guestfish, which needs the KVM device to read
                # UDF. Serving needs python3, which the guestfish image does not
                # have either. initContainers run to completion in order, so the
                # server only ever starts on a finished, verified medium.
                initContainers:
                  - name: fetch
                    image: "{{ iso_serve_image }}"
                    command:
                      - /bin/bash
                      - /opt/remaster/fetch_iso.sh
                    env:
                      - name: ISO_URL
                        value: "{{ windows_iso_url }}"
                      - name: ISO_SHA256
                        value: "{{ windows_iso_sha256 }}"
                      - name: SCRATCH
                        value: /scratch
                    resources:
                      requests:
                        cpu: 200m
                        memory: 256Mi
                      limits:
                        cpu: "2"
                        memory: 1Gi
                    securityContext:
                      runAsNonRoot: true
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                      seccompProfile:
                        type: RuntimeDefault
                    volumeMounts:
                      - name: scratch
                        mountPath: /scratch
                      - name: script
                        mountPath: /opt/remaster
                  - name: remaster
                    image: "{{ iso_remaster_image }}"
                    command:
                      - /bin/bash
                      - /opt/remaster/remaster_iso.sh
                    env:
                      - name: OUT_NAME
                        value: "{{ iso_remaster_filename }}"
                      - name: SCRATCH
                        value: /scratch
                      # libguestfs runs its appliance directly rather than
                      # through libvirt, which it cannot reach from here.
                      - name: LIBGUESTFS_BACKEND
                        value: direct
                      - name: LIBGUESTFS_PATH
                        value: /usr/local/lib/guestfs/appliance
                    resources:
                      requests:
                        cpu: 500m
                        memory: 2Gi
                        # NOT A PRIVILEGE ESCALATION — an extended resource from
                        # the KubeVirt device plugin, which requires request and
                        # limit to match. The pod still runs under restricted-v2
                        # as an arbitrary non-root UID.
                        devices.kubevirt.io/kvm: "1"
                      limits:
                        cpu: "2"
                        memory: 4Gi
                        devices.kubevirt.io/kvm: "1"
                    securityContext:
                      runAsNonRoot: true
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                      seccompProfile:
                        type: RuntimeDefault
                    volumeMounts:
                      - name: scratch
                        mountPath: /scratch
                      - name: script
                        mountPath: /opt/remaster
                containers:
                  - name: serve
                    image: "{{ iso_serve_image }}"
                    command:
                      - python3
                      - -m
                      - http.server
                      - "{{ iso_remaster_port | string }}"
                      - --directory
                      - /scratch/serve
                    # BARE, NOT `| int`. Measured: Ansible hands a nested
                    # "{{ x }}" to the module as the int 8080, and a nested
                    # "{{ x | int }}" as the STRING '8080' — the opposite of
                    # what the filter name suggests. containerPort is int32 and
                    # both probe and Service ports are IntOrString, where a
                    # string means a *named* port, so the wrong one here does
                    # not error: the probe simply never passes.
                    ports:
                      - containerPort: "{{ iso_remaster_port }}"
                    # READINESS IS THE COMPLETION SIGNAL. /ready is written by
                    # the initContainer only after the patched medium has been
                    # renamed into the served directory and re-read, so a
                    # passing probe means "correct, complete ISO", not "process
                    # alive" — and the Service has no endpoints until then.
                    readinessProbe:
                      httpGet:
                        path: /ready
                        port: "{{ iso_remaster_port }}"
                      initialDelaySeconds: 5
                      periodSeconds: 10
                      failureThreshold: 60
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        cpu: "1"
                        memory: 1Gi
                    securityContext:
                      runAsNonRoot: true
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                      seccompProfile:
                        type: RuntimeDefault
                    volumeMounts:
                      - name: scratch
                        mountPath: /scratch
                volumes:
                  - name: scratch
                    persistentVolumeClaim:
                      claimName: "{{ remaster_name }}"
                  - name: script
                    configMap:
                      name: "{{ remaster_name }}"

        - name: Expose the re-master pod to CDI
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Service
              metadata:
                name: "{{ remaster_name }}"
                namespace: "{{ build_namespace }}"
              spec:
                selector:
                  app: "{{ remaster_name }}"
                ports:
                  - name: http
                    port: "{{ iso_remaster_port }}"
                    targetPort: "{{ iso_remaster_port }}"

        - name: Wait for the re-mastered ISO to be served
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            name: "{{ remaster_name }}"
            namespace: "{{ build_namespace }}"
          register: remaster_pod
          retries: "{{ build_wait_retries }}"
          delay: "{{ build_wait_delay }}"
          until:
            - remaster_pod.resources | default([]) | length > 0
            - >-
              remaster_pod.resources[0].status.phase | default('') in ['Failed', 'Succeeded']
              or (remaster_pod.resources[0].status.conditions | default([])
                  | selectattr('type', 'equalto', 'Ready')
                  | selectattr('status', 'equalto', 'True')
                  | list | length > 0)
          # A pod that has EXITED has failed, whichever phase it reports: the
          # script serves the ISO forever on success, so Succeeded here means
          # the HTTP server died.
          failed_when:
            - remaster_pod.resources | default([]) | length > 0
            - remaster_pod.resources[0].status.phase | default('') in ['Failed', 'Succeeded']

      rescue:
        - name: Read the re-master pod's logs
          # BOTH initContainers, by name. The API refuses an unqualified request
          # once a pod has more than one container, and either stage can be the
          # one that failed — a bad checksum stops in 'fetch', a medium that is
          # not what it claims stops in 'remaster'. Asking for only one would
          # hand back an empty log for half the failures.
          kubernetes.core.k8s_log:
            api_version: v1
            kind: Pod
            name: "{{ remaster_name }}"
            namespace: "{{ build_namespace }}"
            container: "{{ item }}"
          register: remaster_log
          failed_when: false
          loop:
            - fetch
            - remaster

        - name: Report the re-master failure with its logs
          # The log is the whole diagnosis — a checksum mismatch, a missing
          # efisys_noprompt.bin, boot images of unequal size and an El Torito
          # address that does not hold the prompting image all fail with
          # different messages, and none of them reach the recap otherwise.
          ansible.builtin.fail:
            msg: >-
              The ISO re-master did not produce a servable ISO. The pod is left
              in place for inspection; clear it with
              -e windows_build_state=absent. Logs follow.
              {% for r in remaster_log.results | default([]) %}
              --- {{ r.item }} ---
              {{ r.log | default('(no log available)') }}
              {% endfor %}

    # VIRTCTL DOES NOT READ K8S_AUTH_*. Those are the python client's variables,
    # consumed by kubernetes.core. virtctl is a Go client: it reads a kubeconfig
    # or its own flags, and with neither it silently falls back to
    # localhost:8080 — "dial tcp [::1]:8080: connect: connection refused" (#33).
    # The play-level `environment:` block covers every kubernetes.core task and
    # nothing else, which is invisible until something actually runs.
    #
    # --token would work, and would put the bearer token in the process list
    # where any local user can read it with `ps`. A 0600 kubeconfig deleted in
    # an always: block does not.
    - name: Have the cluster fetch the ISO directly
      # No virtctl, no kubeconfig, no bytes through this machine. The
      # bind.immediate annotation is the declarative answer to the same
      # WaitForFirstConsumer deadlock --force-bind solves on the upload path.
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: "{{ build_vm_name }}-iso"
            namespace: "{{ build_namespace }}"
            annotations:
              cdi.kubevirt.io/storage.bind.immediate.requested: "true"
              # WHICH MEDIA THIS DISK HOLDS. Read back on the next run, because
              # phase alone cannot tell a re-mastered import from a stock one
              # and both report Succeeded (#40).
              image-factory/iso-variant: "{{ iso_variant_want }}"
          spec:
            source:
              http:
                url: "{{ remaster_url | trim if remaster_needed | bool else windows_iso_url }}"
            storage:
              resources:
                requests:
                  storage: "{{ windows_iso_size }}"
      when:
        - windows_iso_source == 'url'
        - not iso_reusable | bool

    - name: Wait for the ISO import to finish
      kubernetes.core.k8s_info:
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataVolume
        name: "{{ build_vm_name }}-iso"
        namespace: "{{ build_namespace }}"
      register: iso_import
      retries: "{{ build_wait_retries }}"
      delay: "{{ build_wait_delay }}"
      until: iso_import.resources[0].status.phase | default('') in ['Succeeded', 'Failed']
      failed_when: iso_import.resources[0].status.phase | default('') == 'Failed'
      when:
        - windows_iso_source == 'url'
        - not iso_reusable | bool

    - name: Upload the Windows ISO from this machine
      when:
        - windows_iso_source == 'upload'
        - not iso_reusable | bool
      block:
        - name: Create a temporary kubeconfig for virtctl
          ansible.builtin.tempfile:
            state: file
            suffix: .kubeconfig
          register: virtctl_kubeconfig
          changed_when: false

        - name: Write the kubeconfig
          ansible.builtin.copy:
            dest: "{{ virtctl_kubeconfig.path }}"
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
                - name: build
                  cluster:
                    server: {{ k8s_auth_host }}
                    insecure-skip-tls-verify: {{ (not k8s_verify_ssl) | bool | lower }}
              users:
                - name: build
                  user:
                    token: {{ k8s_auth_api_key }}
              contexts:
                - name: build
                  context:
                    cluster: build
                    user: build
                    namespace: {{ build_namespace }}
              current-context: build
          no_log: true
          changed_when: false

        - name: Stream the ISO through the CDI upload proxy
          # Idempotent by check, not by flag: re-uploading several GB because a
          # later task failed would make this playbook painful to iterate on.
          ansible.builtin.command:
            argv:
              - virtctl
              - image-upload
              - dv
              - "{{ build_vm_name }}-iso"
              - "--kubeconfig={{ virtctl_kubeconfig.path }}"
              - "--namespace={{ build_namespace }}"
              - "--size={{ windows_iso_size }}"
              - "--image-path={{ windows_iso_path }}"
              - "--insecure"
              # WaitForFirstConsumer storage will not bind the PVC until a pod
              # consumes it, and the upload needs it bound first — a deadlock
              # that surfaces as "cannot upload to DataVolume in
              # PendingPopulation phase". Measured on sandbox: the default
              # class is ocs-external-storagecluster-ceph-rbd, WFFC. This is the
              # imperative twin of the
              # cdi.kubevirt.io/storage.bind.immediate.requested annotation.
              - "--force-bind"
          register: iso_upload
          changed_when: iso_upload.rc == 0

      always:
        - name: Remove the temporary kubeconfig
          ansible.builtin.file:
            path: "{{ virtctl_kubeconfig.path }}"
            state: absent
          when: virtctl_kubeconfig.path is defined
          changed_when: false

    - name: Record which media the imported ISO holds
      # virtctl creates the DataVolume itself on the upload path, so the
      # annotation cannot be set at creation there; patching here covers both
      # paths with one task. A run that dies between a successful import and
      # this patch simply re-imports next time — two minutes, and the right way
      # round to be wrong.
      kubernetes.core.k8s:
        state: patched
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataVolume
        name: "{{ build_vm_name }}-iso"
        namespace: "{{ build_namespace }}"
        definition:
          metadata:
            annotations:
              image-factory/iso-variant: "{{ iso_variant_want }}"
      when:
        - windows_build_state == 'present'
        - not iso_reusable | bool

    - name: Remove the re-master pod, service, script and scratch volume
      # The media now lives in the DataVolume. Leaving a pod behind holding
      # 20 GiB of scratch and a second copy of it serves nothing, and the VM
      # about to start wants the memory.
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: "{{ item }}"
        name: "{{ remaster_name }}"
        namespace: "{{ build_namespace }}"
        wait: true
      loop:
        - Pod
        - Service
        - ConfigMap
        - PersistentVolumeClaim
      when: remaster_needed | bool

    - name: Create the Windows build VM
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            name: "{{ build_vm_name }}"
            namespace: "{{ build_namespace }}"
            labels:
              app.kubernetes.io/managed-by: image-builder-pipeline
              image-factory/os: windows-2022
              image-factory/eval-expires: "{{ windows_eval_expires }}"
          spec:
            # runStrategy Once, NOT running: true (#37). With `running: true`
            # KubeVirt restarts the VM whenever the guest powers off — so
            # sysprep's /shutdown was undone within seconds, the generalized
            # image booted straight into OOBE, and completing that screen would
            # have consumed the generalization and silently turned the golden
            # image into an ordinary specialized machine.
            #
            # `Once` starts the VMI exactly once and leaves the VM Stopped when
            # the guest halts, which is also what makes "wait for Stopped" a
            # real completion signal rather than a race.
            runStrategy: Once
            instancetype:
              kind: VirtualMachineClusterInstancetype
              name: "{{ build_instancetype }}"
            preference:
              kind: VirtualMachineClusterPreference
              name: "{{ build_preference }}"
            dataVolumeTemplates:
              - metadata:
                  name: "{{ build_vm_name }}-root"
                spec:
                  source:
                    blank: {}
                  storage:
                    resources:
                      requests:
                        storage: "{{ target_disk_size }}"
            template:
              metadata:
                labels:
                  kubevirt.io/domain: "{{ build_vm_name }}"
              spec:
                terminationGracePeriodSeconds: "{{ build_termination_grace_seconds }}"
                domain:
                  devices:
                    disks:
                      # BOOT THE DISK FIRST, CD SECOND — and this order is only
                      # correct because the media no longer prompts (#50).
                      #
                      # WHY IT LOOPED THE OTHER WAY ROUND. Windows Setup reboots
                      # partway through every installation. The firmware then
                      # re-runs the boot order, and with the CD first and no
                      # prompt to time out, it booted the CD again and Setup
                      # started from zero — forever, with the progress bar
                      # moving the whole time. Four hours of it looked exactly
                      # like a slow build.
                      #
                      # "Press any key to boot from CD or DVD" is what made
                      # CD-first survivable: it is the mechanism that lets a
                      # machine with bootable install media boot the INSTALLED
                      # OS on later reboots. #36 put the CD first for a real
                      # reason — with the disk first, EFI found no ESP on the
                      # blank disk and fell through to a prompt nobody could
                      # answer — and #40 removed that reason without reverting
                      # it.
                      #
                      # Disk-first is now self-resolving, and it is what Red
                      # Hat's windows-efi-installer ships (rootdisk bootOrder 1,
                      # installcdrom bootOrder 2):
                      #   first boot — blank disk has no ESP, firmware falls
                      #     through to the CD, no-prompt media boots Setup
                      #   later boots — the disk has an ESP, so the installed OS
                      #     boots and Setup carries on to sysprep
                      #
                      # DO NOT SWAP THESE BACK without also restoring the
                      # prompt. The two settings are one decision.
                      - name: rootdisk
                        disk:
                          bus: "{{ windows_disk_bus }}"
                        bootOrder: 1
                      - name: installcd
                        cdrom:
                          bus: sata
                        bootOrder: 2
                      - name: virtiocd
                        cdrom:
                          bus: sata
                      - name: unattendcd
                        cdrom:
                          bus: sata
                    interfaces:
                      - name: default
                        masquerade: {}
                networks:
                  - name: default
                    pod: {}
                volumes:
                  - name: rootdisk
                    dataVolume:
                      name: "{{ build_vm_name }}-root"
                  - name: installcd
                    dataVolume:
                      name: "{{ build_vm_name }}-iso"
                  - name: virtiocd
                    containerDisk:
                      image: "{{ virtio_win_image_resolved }}"
                  - name: unattendcd
                    configMap:
                      name: "{{ build_vm_name }}-autounattend"

    - name: Wait for the VM to start
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachineInstance
        name: "{{ build_vm_name }}"
        namespace: "{{ build_namespace }}"
      register: build_vmi
      retries: "{{ build_wait_retries }}"
      delay: "{{ build_wait_delay }}"
      until:
        - build_vmi.resources | default([]) | length > 0
        - build_vmi.resources[0].status.phase | default('') == 'Running'

    - name: Wait for Windows to finish installing
      # THE GUEST AGENT IS THE SIGNAL, not a timer. It is installed by
      # FirstLogonCommands, so guestOSInfo appearing means Setup completed, the
      # machine rebooted into the OS, and the agent came up. A sleep here would
      # be a guess, and guesses are what make unattended builds flaky.
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachineInstance
        name: "{{ build_vm_name }}"
        namespace: "{{ build_namespace }}"
      register: guest_info
      retries: "{{ build_wait_retries }}"
      delay: "{{ build_wait_delay }}"
      until:
        - guest_info.resources | default([]) | length > 0
        - guest_info.resources[0].status.guestOSInfo.id | default('') | length > 0
      when: not windows_sysprep_at_first_logon

    # --- CIS hardening: WinRM tunnel from this machine to the build VM -----
    - name: Set up WinRM access to the build VM
      when:
        - windows_build_state == 'present'
        - windows_cis_harden | bool
        - not windows_sysprep_at_first_logon | bool
      block:
        - name: Create a Service for WinRM on the build VM
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Service
              metadata:
                name: "{{ build_vm_name }}-winrm"
                namespace: "{{ build_namespace }}"
                labels:
                  app.kubernetes.io/managed-by: image-builder-pipeline
              spec:
                selector:
                  kubevirt.io/domain: "{{ build_vm_name }}"
                ports:
                  - name: winrm-https
                    port: "{{ winrm_port }}"
                    targetPort: "{{ winrm_port }}"

        - name: Create a temporary kubeconfig for port-forward
          ansible.builtin.tempfile:
            state: file
            suffix: .kubeconfig
          register: pf_kubeconfig
          changed_when: false

        - name: Write the kubeconfig
          ansible.builtin.copy:
            dest: "{{ pf_kubeconfig.path }}"
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
                - name: build
                  cluster:
                    server: {{ k8s_auth_host }}
                    insecure-skip-tls-verify: {{ (not k8s_verify_ssl) | bool | lower }}
              users:
                - name: build
                  user:
                    token: {{ k8s_auth_api_key }}
              contexts:
                - name: build
                  context:
                    cluster: build
                    user: build
                    namespace: {{ build_namespace }}
              current-context: build
          no_log: true
          changed_when: false

        - name: Start port-forward to the build VM's WinRM
          # BACKGROUND PROCESS, cleaned up in Play 3. If the playbook dies
          # before cleanup, `kill $(cat /tmp/ibp-pf.pid)` clears it.
          ansible.builtin.shell: |
            nohup kubectl port-forward \
              --kubeconfig={{ pf_kubeconfig.path }} \
              -n {{ build_namespace }} \
              svc/{{ build_vm_name }}-winrm \
              {{ winrm_forward_port }}:{{ winrm_port }} \
              >/dev/null 2>&1 &
            PF_PID=$!
            echo $PF_PID > /tmp/ibp-pf.pid
            echo $PF_PID
          register: pf_result
          changed_when: false

        - name: Record the port-forward for cleanup
          ansible.builtin.set_fact:
            port_forward_pid: "{{ pf_result.stdout | trim }}"
            cis_kubeconfig_path: "{{ pf_kubeconfig.path }}"

        - name: Wait for the port-forward to accept connections
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: "{{ winrm_forward_port }}"
            timeout: 120
            delay: 5

        - name: Register the build VM as a dynamic inventory host
          ansible.builtin.add_host:
            name: build_vm
            groups: build_targets
            ansible_host: 127.0.0.1
            ansible_port: "{{ winrm_forward_port }}"
            ansible_connection: winrm
            ansible_winrm_transport: ntlm
            ansible_winrm_server_cert_validation: ignore
            ansible_user: Administrator
            ansible_password: "{{ windows_admin_password }}"
            build_marker_file: "{{ build_marker_file }}"

    - name: Wait for the build to sysprep and shut down
      when: windows_sysprep_at_first_logon
      block:
        - name: Watch for the guest to power itself off
          # With sysprep in the answer file the VM powers itself off when it is
          # done, so "stopped" is the completion signal. VirtualMachine, not
          # VMI: the VMI object disappears when the guest halts.
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: VirtualMachine
            name: "{{ build_vm_name }}"
            namespace: "{{ build_namespace }}"
          register: build_vm
          retries: "{{ build_wait_retries }}"
          delay: "{{ build_wait_delay }}"
          until:
            - build_vm.resources | default([]) | length > 0
            - build_vm.resources[0].status.printableStatus | default('') in ['Stopped', 'Halted']

      rescue:
        # A TIMEOUT HERE HAS ONE LIKELY CAUSE, AND IT LOOKS HEALTHY (#50). If
        # the firmware boots the install CD ahead of the disk, Windows Setup's
        # own mid-installation reboot lands back on the CD and starts over —
        # with the progress bar moving the entire time. Four hours of that read
        # as "slow storage" before anyone read the percentage twice. Saying so
        # here costs nothing and saves the next person that afternoon.
        - name: Explain what a build that never stops usually means
          ansible.builtin.fail:
            msg: >-
              {{ build_vm_name }} never reached Stopped in
              {{ (build_wait_retries | int * build_wait_delay | int / 60) | round | int }}
              minutes. It last reported
              '{{ (build_vm.resources | default([]) | first
                   | default({})).status.printableStatus | default('unknown') }}'.
              The usual cause is Windows Setup restarting rather than
              progressing: read the console percentage twice, a few minutes
              apart, and if it goes DOWN the install is looping. Check that
              rootdisk has bootOrder 1 and installcd bootOrder 2 —
              CD-first only works with prompting media (#50). If the console
              shows a desktop instead of Setup, the answer-file deletion
              assert failed (#69) — read C:\Windows\Temp\panther-delete.log
              via WinRM or offline (docs/design.md §10.2.2). Otherwise watch
              the console:
              virtctl vnc {{ build_vm_name }} -n {{ build_namespace }}

    - name: Report the install phase
      ansible.builtin.debug:
        msg:
          - "Windows Server 2022 installed in {{ build_namespace }} on {{ k8s_auth_host }}."
          - "Disk:           {{ build_vm_name }}-root ({{ target_disk_size }})"
          - >-
            Media:          {{ iso_variant_want }} ISO —
            {{ 're-mastered on the cluster, no keypress needed'
               if iso_variant_want == 'noprompt'
               else 'WATCH THE CONSOLE, Setup asks for a keypress' }}
          - >-
            CIS:            {{ 'L1 Member Server (Play 2 next)' if windows_cis_harden | bool
                              else 'none — windows_cis_harden is false' }}
          - >-
            Sysprep:        {{ 'answer file (already done)'
                              if windows_sysprep_at_first_logon | bool
                              else ('WinRM after CIS (Play 2)'
                                    if windows_cis_harden | bool
                                    else 'none — VM left running for inspection') }}
          - "EVAL EXPIRES:   {{ windows_eval_expires }} — put this in the run-sheet."
          - "Tear down with: -e windows_build_state=absent"

# ===========================================================================
# Play 2 — CIS L1 hardening + sysprep
#
# Runs ONLY when windows_cis_harden is true AND add_host created 'build_vm'.
# If windows_cis_harden is false or windows_sysprep_at_first_logon is true,
# Ansible sees no host named build_vm and skips this play entirely.
# ===========================================================================

- name: Apply CIS L1 hardening to the build VM
  hosts: build_vm
  gather_facts: false

  vars_files:
    - vars/cis_profile.yml

  tasks:
    - name: Wait for WinRM to be ready
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather Windows facts
      ansible.builtin.setup:

    - name: Wait for FirstLogonCommands to finish
      # The build marker is written by Order 4, after the guest agent (2),
      # virtio drivers (1), and WinRM (3). It is the last thing before the
      # cached answer file delete (5-7) and sysprep (8, if enabled).
      ansible.windows.win_stat:
        path: "C:\\Windows\\Temp\\{{ build_marker_file }}"
      register: marker
      retries: 30
      delay: 10
      until: marker.stat.exists | default(false)

    - name: Apply CIS L1 Member Server hardening
      ansible.builtin.include_role:
        name: windows_2022_cis

    - name: Remove per-user AppX packages that block sysprep
      ansible.windows.win_powershell:
        script: |
          Get-AppxPackage | Remove-AppxPackage -ErrorAction SilentlyContinue
          Get-AppxPackage -AllUsers | Remove-AppxPackage -AllUsers -ErrorAction SilentlyContinue
      failed_when: false

    - name: Record CIS success on localhost for Play 3
      ansible.builtin.set_fact:
        cis_applied: true
      delegate_to: localhost
      delegate_facts: true

    - name: Generalize and shut down
      # async because sysprep shuts down the VM, which kills WinRM before
      # the command can report completion. Fire and forget — Play 3 detects
      # the shutdown by watching the VirtualMachine status.
      ansible.windows.win_command:
        cmd: >-
          C:\Windows\System32\Sysprep\sysprep.exe
          /generalize /oobe /shutdown /quiet
      async: 120
      poll: 0

# ===========================================================================
# Play 3 — wait for the VM to stop, clean up the tunnel, report
#
# Runs on localhost regardless of whether Play 2 succeeded or failed.
# ===========================================================================

- name: Complete the build
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    build_vm_name: "win2k22-build"
    build_namespace: "image-factory-windows"
    build_wait_retries: 120
    build_wait_delay: 30
    k8s_auth_host: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_HOST') }}"
    k8s_auth_api_key: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY') }}"
    k8s_verify_ssl: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_VERIFY_SSL') | default(false, true) | bool }}"

  environment:
    K8S_AUTH_HOST: "{{ k8s_auth_host }}"
    K8S_AUTH_API_KEY: "{{ k8s_auth_api_key }}"
    K8S_AUTH_VERIFY_SSL: "{{ k8s_verify_ssl | string }}"

  tasks:
    - name: Wait for the VM to shut down after CIS hardening
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ build_vm_name }}"
        namespace: "{{ build_namespace }}"
      register: build_vm_final
      retries: "{{ build_wait_retries }}"
      delay: "{{ build_wait_delay }}"
      until:
        - build_vm_final.resources | default([]) | length > 0
        - build_vm_final.resources[0].status.printableStatus | default('') in ['Stopped', 'Halted']
      when: cis_applied | default(false)

    - name: Kill the port-forward process
      ansible.builtin.command: "kill {{ port_forward_pid }}"
      changed_when: true
      failed_when: false
      when: port_forward_pid is defined

    - name: Remove the port-forward PID file
      ansible.builtin.file:
        path: /tmp/ibp-pf.pid
        state: absent
      changed_when: false
      when: port_forward_pid is defined

    - name: Remove the temporary kubeconfig
      ansible.builtin.file:
        path: "{{ cis_kubeconfig_path }}"
        state: absent
      changed_when: false
      when: cis_kubeconfig_path is defined

    - name: Remove the WinRM Service
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Service
        name: "{{ build_vm_name }}-winrm"
        namespace: "{{ build_namespace }}"
      when: cis_applied | default(false)

    - name: Fail if CIS hardening did not complete
      ansible.builtin.fail:
        msg: >-
          CIS hardening DID NOT COMPLETE — the VM is still running and has
          not been sysprepped. Tear down with -e windows_build_state=absent,
          fix the profile, and rebuild.
      when:
        - port_forward_pid is defined
        - not (cis_applied | default(false))

    - name: Report the completed build
      ansible.builtin.debug:
        msg:
          - "CIS L1 hardened, sysprepped and STOPPED — {{ build_vm_name }} in {{ build_namespace }}"
          - "Next: publish with playbooks/publish_windows_containerdisk.yml"
          - "Tear down with: -e windows_build_state=absent"
      when: port_forward_pid is defined
