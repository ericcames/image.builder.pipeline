---
sno_ocp_channel: stable-4.22
sno_ocp_version: latest

sno_openshift_install_url: >-
  https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ sno_ocp_version }}/openshift-install-linux.tar.gz

sno_cluster_name: edge
sno_base_domain: internal.ames.net

sno_network_type: OVNKubernetes
sno_service_network: 172.30.0.0/16
sno_cluster_network: 10.128.0.0/14
sno_cluster_network_host_prefix: 23

# Where the LVMS partition starts, which is what caps the root partition.
# A partition declared after root stops growpart expanding into the tail of the
# disk; sizing root directly does not work, because ignition-ostree-growfs runs
# after ignition-disks and undoes it (see docs/design.md 11.6).
# Set to 0 to skip the MachineConfig and let root fill the entire disk.
sno_root_partition_size_gb: 200

sno_hardware_minimums:
  ram_gb: 32
  disk_gb: 120
  cpus: 8

sno_aap_channel: stable-2.7
sno_cnv_channel: stable
sno_compliance_operator_channel: stable
sno_lvms_channel: stable-4.22
